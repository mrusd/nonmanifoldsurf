      cur = target; busy = false; ours = false; sync();
    }, function () { busy = false; ours = false; });
  }

  // tags: static. When switched on, every tag shows except those of hidden blocks.
  function syncLabels() {
    if (!tagN.length || relaying) return;
    var upd = {}, any = false;
    tagN.forEach(function (n, k) {
      var v = tagsOn && !hidden.has(labOwner[k]);
      if (!tagVis || tagVis[k] !== v) { upd['scene.annotations[' + k + '].visible'] = v; any = true; }
    });
    if (!any) return;
    relaying = true;
    Plotly.relayout(gd, upd).then(function () {
      tagVis = tagN.map(function (_, k) { return gd.layout.scene.annotations[k].visible !== false; });
      relaying = false;
    }, function () { relaying = false; });
  }
  gd.on('plotly_buttonclicked', function (ev) {
    var lab = ev && ev.button && ev.button.label;
    if (lab === 'Show tags' || lab === 'Hide tags') { tagsOn = (lab === 'Show tags'); syncLabels(); }
  });
  setTimeout(syncLabels, 0);
  gd.on('plotly_hover', function (ev) {
    var i = ev.points && ev.points.length ? ev.points[0].curveNumber : -1;
    clearTimeout(timer);
    want = (base[i] !== undefined) ? i : -1;
    sync();
  });
  gd.on('plotly_unhover', function () {
    clearTimeout(timer);                   // an unhover from our own redraw is followed
    timer = setTimeout(function () { want = -1; sync(); }, 120);   // at once by a hover
  });
  // The X-ray / offset-vector buttons restyle the blocks too (they set visible = true):
  // note what they changed, then re-apply the user's hidden set.
  gd.on('plotly_restyle', function (ev) {
    if (ours || !ev) return;
    var upd = ev[0] || {}, idx = ev[1] || ids;
    if ('visible' in upd) idx.forEach(function (i) { if (i in shownVis) shownVis[i] = 'unknown'; });
    setTimeout(sync, 0);
  });

  // ---- right-click menu ----------------------------------------------------------
  var menu = document.createElement('div');
  menu.style.cssText = 'position:fixed;z-index:1000;display:none;min-width:200px;' +
    'background:#fff;border:1px solid #c9d1d9;border-radius:8px;padding:4px 0;' +
    'box-shadow:0 6px 18px rgba(0,0,0,.18);font:13px system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2733';
  document.body.appendChild(menu);
  function item(label, fn, enabled) {
    var d = document.createElement('div');
    d.textContent = label;
    d.style.cssText = 'padding:6px 14px;white-space:nowrap;cursor:' + (enabled ? 'pointer' : 'default') +
                      ';color:' + (enabled ? 'inherit' : '#9aa6b4');
    if (enabled) {
      d.onmouseenter = function () { d.style.background = '#eef6f8'; };
      d.onmouseleave = function () { d.style.background = ''; };
      d.onclick = function () { closeMenu(); fn(); };
    }
    menu.appendChild(d);
  }
  function sep() { var h = document.createElement('div');
    h.style.cssText = 'height:1px;background:#e3e8ee;margin:4px 0'; menu.appendChild(h); }
  function openMenu(x, y) {
    var i = (want >= 0 && !hidden.has(want)) ? want : -1;
    menu.innerHTML = '';
    var head = document.createElement('div');
    head.textContent = i >= 0 ? names[i] : 'No block under the mouse';
    head.style.cssText = 'padding:6px 14px 4px;font-weight:600;color:#5b6776;white-space:nowrap';
    menu.appendChild(head); sep();
    item('Hide this block', function () { hidden.add(i); want = -1; sync(); }, i >= 0);
    item('Show only this block', function () {
      ids.forEach(function (j) { if (j !== i) hidden.add(j); }); hidden.delete(i); sync(); }, i >= 0);
    item('Show all blocks' + (hidden.size ? ' (' + hidden.size + ' hidden)' : ''),
         function () { hidden.clear(); sync(); }, hidden.size > 0);
    menu.style.display = 'block';
    var r = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
  }
  function closeMenu() { menu.style.display = 'none'; }

  // Open on a right CLICK only (press and release without moving), so a right-drag
  // still pans the 3D view. Listen in the capture phase so the plot can't swallow it.
  var down = null;
  gd.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  gd.addEventListener('mousedown', function (e) {
    if (e.button === 2) down = [e.clientX, e.clientY]; else closeMenu();
  }, true);
  window.addEventListener('mouseup', function (e) {
    if (e.button !== 2 || !down) return;
    var moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]);
    down = null;
    if (moved < 5) openMenu(e.clientX, e.clientY);
  }, true);
  document.addEventListener('mousedown', function (e) {
    if (!menu.contains(e.target) && !gd.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  gd.addEventListener('wheel', closeMenu, {passive: true});
})();

                        })                };            </script>        </div>
</body>
